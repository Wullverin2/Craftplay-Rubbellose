language:
  default: de

database:
  use_mysql: false
  table_prefix: "cpsc_"
  sqlite:
    file: "scratchcards.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    use_ssl: false
    pool:
      max_pool_size: 10
      min_idle: 2
      connection_timeout_ms: 30000

scratchcard:
  item:
    amount_limit_per_stack: 64
  loading:
    enabled: true
    duration_ticks: 60
    steps: 20
    actionbar:
      text: "&6Rubellos wird generiert... %bar% &e%percent%%"
      finished: "&aRubellos bereit!"
      bar:
        length: 10
        filled: "&a█"
        empty: "&7░"
  gui:
    required_opened_fields: 9
    auto_close_after_payout_ticks: 60
  result:
    winning_matches: 3

limits:
  enabled: true
  # Das Kauf-Tageslimit wird um 00:00 Uhr nach Rootserver-/JVM-Zeit zurueckgesetzt.
  max_purchases_per_day: 25

purchases:
  # Maximal gleichzeitig kaufbare Lose; das Tageskauflimit gilt für jedes einzelne Los.
  max_amount_per_purchase: 64

cooldown:
  open_seconds: 3
  buy_seconds: 1

daily:
  enabled: true
  type: small
  amount: 1
  require_inventory_space: true
  notify_on_join: true

feedback:
  sounds:
    enabled: true
    start:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 0.7
      pitch: 1.2
    reveal:
      enabled: true
      sound: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.5
    buy:
      enabled: true
      sound: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 0.8
      pitch: 1.2
    daily:
      enabled: true
      sound: ENTITY_ITEM_PICKUP
      volume: 0.8
      pitch: 1.1
    win:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.0
    lose:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 0.7
      pitch: 0.7
    jackpot:
      enabled: true
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
  titles:
    enabled: true
    win:
      enabled: true
      title: "&aGewonnen!"
      subtitle: "&e%reward%"
      fade_in_ticks: 10
      stay_ticks: 45
      fade_out_ticks: 10
    lose:
      enabled: true
      title: "&7Niete"
      subtitle: "&fVielleicht beim nächsten Los"
      fade_in_ticks: 10
      stay_ticks: 35
      fade_out_ticks: 10
    jackpot:
      enabled: true
      title: "&dJackpot!"
      subtitle: "&e%reward%"
      fade_in_ticks: 10
      stay_ticks: 60
      fade_out_ticks: 20

rarities:
  common:
    display_name: "&7Gewöhnlich"
  uncommon:
    display_name: "&aUngewöhnlich"
  rare:
    display_name: "&9Selten"
  epic:
    display_name: "&5Episch"
  legendary:
    display_name: "&6Legendary"
  jackpot:
    display_name: "&dJackpot"

lucky_hour:
  enabled: true
  windows:
    evening:
      enabled: true
      display_name: "&6Lucky Hour"
      start: "18:00"
      end: "19:00"
      win_chance_multiplier: 1.25
      money_multiplier: 1.10

mystery_multiplier:
  enabled: true
  money_rewards_only: true
  multipliers:
    normal:
      value: 1.0
      chance: 82.0
    double:
      value: 2.0
      chance: 15.0
    triple:
      value: 3.0
      chance: 3.0

stats:
  top_winners_limit: 10
  latest_jackpots_limit: 10

debug:
  enabled: false
  file: "debug-errors.txt"
  write_info_messages: true
