language:
  default: de

database:
  use_mysql: false
  table_prefix: "cpsc_"
  sqlite:
    file: "scratchcards.db"
  mysql:
    host: "localhost"
    port: 3306
    database: "minecraft"
    username: "root"
    password: ""
    use_ssl: false
    pool:
      max_pool_size: 10
      min_idle: 2
      connection_timeout_ms: 30000

scratchcard:
  item:
    amount_limit_per_stack: 64
  loading:
    enabled: true
    duration_ticks: 60
    steps: 20
    actionbar:
      text: "&6Rubellos wird generiert... %bar% &e%percent%%"
      finished: "&aRubellos bereit!"
      bar:
        length: 10
        filled: "&a█"
        empty: "&7░"
  gui:
    required_opened_fields: 9
    auto_close_after_payout_ticks: 60
  result:
    winning_matches: 3

limits:
  enabled: true
  # Alle Tageslimits werden um 00:00 Uhr nach Rootserver-/JVM-Zeit zurueckgesetzt.
  max_purchases_per_day: 25
  max_opens_per_day: 25
  # 0 deaktiviert das Besitzlimit. Gezaehlt werden echte Rubellos-Items mit Plugin-Markierung im Inventar.
  max_owned_scratchcards: 64

cooldown:
  open_seconds: 3
  buy_seconds: 1

daily:
  enabled: true
  type: small
  amount: 1
  require_inventory_space: true
  respect_owned_limit: true
  notify_on_join: true

bedrock_support:
  # Hilft Bedrock/Geyser-Spielern, wenn Slash-Commands vom Bedrock-Client blockiert werden.
  enabled: true
  detect_geyser: true
  detect_floodgate: true
  # Fallback, falls keine API verfuegbar ist. Passe die Prefixe an deine Floodgate/Geyser-Konfiguration an.
  name_prefixes:
    - "."
    - "*"
  notify_on_join: true
  shop_item:
    enabled: true
    give_on_join: true
    only_bedrock: true
    keep_single: true
    slot: 8
    material: SUNFLOWER
    name: "&6Rubellos-Menue"
    lore:
      - "&7Bedrock-kompatibler Shop-Oeffner."
      - "&7Umgeht Clients, die Slash-Commands blockieren."
      - ""
      - "&eRechtsklick: Shop oeffnen"

feedback:
  sounds:
    enabled: true
    start:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 0.7
      pitch: 1.2
    reveal:
      enabled: true
      sound: UI_BUTTON_CLICK
      volume: 0.6
      pitch: 1.5
    buy:
      enabled: true
      sound: ENTITY_EXPERIENCE_ORB_PICKUP
      volume: 0.8
      pitch: 1.2
    daily:
      enabled: true
      sound: ENTITY_ITEM_PICKUP
      volume: 0.8
      pitch: 1.1
    win:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      volume: 1.0
      pitch: 1.0
    lose:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      volume: 0.7
      pitch: 0.7
    jackpot:
      enabled: true
      sound: UI_TOAST_CHALLENGE_COMPLETE
      volume: 1.0
      pitch: 1.0
  titles:
    enabled: true
    win:
      enabled: true
      title: "&aGewonnen!"
      subtitle: "&e%reward%"
      fade_in_ticks: 10
      stay_ticks: 45
      fade_out_ticks: 10
    lose:
      enabled: true
      title: "&7Niete"
      subtitle: "&fVielleicht beim naechsten Los"
      fade_in_ticks: 10
      stay_ticks: 35
      fade_out_ticks: 10
    jackpot:
      enabled: true
      title: "&dJackpot!"
      subtitle: "&e%reward%"
      fade_in_ticks: 10
      stay_ticks: 60
      fade_out_ticks: 20

rarities:
  common:
    display_name: "&7Gewoehnlich"
  uncommon:
    display_name: "&aUngewoehnlich"
  rare:
    display_name: "&9Selten"
  epic:
    display_name: "&5Episch"
  legendary:
    display_name: "&6Legendary"
  jackpot:
    display_name: "&dJackpot"

lucky_hour:
  enabled: true
  windows:
    evening:
      enabled: true
      display_name: "&6Lucky Hour"
      start: "18:00"
      end: "19:00"
      win_chance_multiplier: 1.25
      money_multiplier: 1.10

mystery_multiplier:
  enabled: true
  money_rewards_only: true
  multipliers:
    normal:
      value: 1.0
      chance: 82.0
    double:
      value: 2.0
      chance: 15.0
    triple:
      value: 3.0
      chance: 3.0

streak:
  enabled: true
  reward_every_days: 7
  reward:
    money: 2500
    commands:
      - "crate key give %player% vote 1"

series:
  enabled: true
  sets:
    small_starter:
      enabled: true
      display_name: "&aKleine Starter-Serie"
      type: small
      required_rewards:
        - coins_100
        - coins_500
        - coins_1500
        - vote_key
        - jackpot
      completion:
        money: 5000
        commands: []
        broadcast: true
    premium_master:
      enabled: true
      display_name: "&dPremium Meister-Serie"
      type: premium
      required_rewards:
        - coins_2500
        - coins_7500
        - coins_20000
        - epic_key
        - jackpot
      completion:
        money: 25000
        commands:
          - "crate key give %player% epic 1"
        broadcast: true

server_goal:
  enabled: true
  id: "goal_500_opens"
  target_opens: 500
  reward_money_online: 2500
  commands:
    - "broadcast Das Rubellos-Serverziel wurde erreicht!"

pass:
  enabled: true
  season_id: "season_1"
  season_name: "Rubellos Saison 1"
  xp:
    buy: 10
    open: 15
    win: 25
    jackpot: 250
    daily: 20
  levels:
    1:
      required_xp: 100
      money: 1000
      commands: []
    5:
      required_xp: 750
      money: 2500
      commands:
        - "crate key give %player% vote 2"
    10:
      required_xp: 2500
      money: 10000
      commands:
        - "rubbellos give %player% premium 1"

quests:
  enabled: true
  daily:
    buy_3:
      enabled: true
      display_name: "&eKaufe 3 Lose"
      event: buy
      target: 3
      reward:
        money: 500
        commands: []
    open_5:
      enabled: true
      display_name: "&aOeffne 5 Lose"
      event: open
      target: 5
      reward:
        money: 1000
        commands: []
    win_2:
      enabled: true
      display_name: "&6Gewinne 2x"
      event: win
      target: 2
      reward:
        money: 1500
        commands: []

pity:
  enabled: true
  after_losses: 10
  guaranteed_reward: "coins_100"

group_goals:
  enabled: true
  goals:
    daily_opens:
      enabled: true
      display_name: "&6Gemeinsam 100 Lose oeffnen"
      event: open
      target: 100
      reward:
        money: 1000
        commands: []

risk:
  enabled: true
  minimum_money: 100
  expire_seconds: 60
  win_chance: 50.0
  multiplier: 2.0

stats:
  top_winners_limit: 10
  latest_jackpots_limit: 10

debug:
  enabled: false
  file: "debug-errors.txt"
  write_info_messages: true
